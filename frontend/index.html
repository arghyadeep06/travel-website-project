<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Destinations</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <style>
    html {
      scroll-behavior: smooth;
    }

    .hero {
      background: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
      height: 70vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
    }

    .card-img-top {
      height: 220px;
      object-fit: cover;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .form-floating > .form-control::placeholder {
      color: transparent;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
      <a class="navbar-brand" href="#">🌍 TravelNow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#destinations">Destinations</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content container">
      <h1 class="mb-3">Explore the World with Us</h1>
      <p class="lead">Discover amazing places and unforgettable experiences</p>
      <a href="#destinations" class="btn btn-warning mt-3">Explore Now</a>
    </div>
  </section>

  <!-- Main Content -->
  <div class="container py-5" id="destinations">
    <h2 class="text-center mb-5">Top Destinations</h2>

    <div class="row justify-content-center" id="cards">
      <!-- Cards will be added here dynamically -->
    </div>
  </div>

  <!-- Contact Section -->
  <section class="bg-light py-5" id="contact">
    <div class="container">
      <h2 class="text-center mb-4">Contact Us</h2>
      <form id="contact-form" class="mx-auto" style="max-width: 600px;" novalidate>
        <div class="form-floating mb-3">
          <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required />
          <label for="name"></label>
        </div>

        <div class="form-floating mb-3">
          <input type="email" id="email" name="email" class="form-control" placeholder="Your Email" required />
          <label for="email"></label>
        </div>

        <div class="form-floating mb-4">
          <textarea id="message" name="message" class="form-control" placeholder="Your Message" style="height: 120px;" required></textarea>
          <label for="message"></label>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4">Send Message</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Load destinations -->
  <script>
    async function loadDestinations() {
      try {
        const res = await fetch('/api/destinations');
        const data = await res.json();
        const cards = document.getElementById('cards');

        data.forEach(dest => {
          const col = document.createElement('div');
          col.className = 'col-12 col-sm-6 col-md-4 mb-4 d-flex align-items-stretch';

          col.innerHTML = `
            <div class="card shadow-sm border-0 w-100">
              <img src="${dest.img}" class="card-img-top" alt="${dest.name}" />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title text-center">${dest.name}</h5>
                <p class="card-text text-center">${dest.description}</p>
              </div>
            </div>
          `;

          cards.appendChild(col);
        });
      } catch (error) {
        console.error('❌ Error loading destinations:', error);
      }
    }

    loadDestinations();

    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Thank you for contacting us, ' + this.name.value + '!');
      this.reset();
    });
  </script>
  <!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
  <div class="container">
    <small>© 2025 TravelNow. All Rights Reserved.</small>
  </div>
</footer>

</body>
</html>
